# ══════════════════════════════════════════════════════════════════════════════
# tmux Configuration — portable base (shared by every host)
# Flexoki Theme + Session Persistence + Claude Code Workflows
# ══════════════════════════════════════════════════════════════════════════════

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Core Settings                                                                │
# └──────────────────────────────────────────────────────────────────────────────┘

# Eliminate escape delay (critical for responsiveness)
set -s escape-time 0

# Terminal settings
set -g default-terminal "tmux-256color"

# Truecolor passthrough — tmux's built-in terminal-features doesn't mark
# tmux-256color as RGB-capable, so 24-bit SGR sequences from TUI apps
# (lipgloss/v2, bubbletea) get downsampled to 256-color before reaching
# the outer terminal.
#
# Two layers, both needed:
# - terminal-features RGB: wires up AX/setrgbf/setrgbb so tmux emits the
#   modern colon-separated 24-bit SGR form.
# - terminal-overrides Tc:RGB: sets the explicit termcap booleans that
#   lipgloss/termenv inspect at startup to decide whether to commit to
#   truecolor or downgrade. (Tmux 3.3a's RGB feature applies AX+setrgbf
#   but does NOT set the RGB boolean cap, so terminfo-checking libraries
#   still see "no RGB" without this line — tracked down on the home server 2026-05-16.)
#
# set-environment also pins COLORTERM in tmux's global env so it survives
# how the server was originally started (launchd, ssh, resurrected).
set -ga terminal-features ",*256col*:RGB"
set -ga terminal-overrides ",*256col*:Tc:RGB"
set-environment -g COLORTERM truecolor

# ── Interactive shell: zsh for humans, bash for agents ────────────────────────
# The login shell is bash (chsh -s /opt/homebrew/bin/bash) so Claude Code's Bash
# tool runs bash — it snapshots the LOGIN shell, and agents inheriting zsh's
# no-word-splitting semantics against bash-shaped recipes fails OPEN and prints
# success. See claude-dotfiles-yme.9 and dot_bashrc.tmpl.
#
# But tmux derives `default-shell` from $SHELL at SERVER start and hands it to
# every pane, so the flip would silently make interactive panes bash too.
#
# Do NOT "fix" that with `set -g default-shell /bin/zsh`: tmux then REWRITES
# $SHELL to zsh inside the pane, so Claude Code snapshots zsh again and the flip
# is defeated exactly where we work. Measured 2026-08-24, both directions.
#
# `default-command` is the lever that separates them — it sets what the pane
# RUNS without touching $SHELL:
#     pane_current_command = zsh                    (humans get zsh)
#     $SHELL = /opt/homebrew/bin/bash               (Claude Code snapshots bash)
#
# Resolved via PATH, not hardcoded to /bin/zsh: this file is the portable base
# for all three hosts and zsh lives elsewhere (or nowhere) off macOS — a bad
# default-command kills every pane on that host. Falls back to $SHELL, then
# /bin/sh, so a zsh-less host still gets a working pane (claude-dotfiles-yme.10).
#
# MUST be a SINGLE command, not a compound `if ...; fi` statement: tmux-resurrect
# builds each restored pane's command by textually prefixing "exec " to this
# value (restore.sh:123), and `exec if ...` is a bash syntax error — which
# killed every restored pane, left zero sessions, and made the server exit a
# beat after attach. The if/else now lives inside the script. See its header.
#
# Only takes effect at server start — setting it on a running server does not
# apply. Verify after a restart: echo $SHELL; tmux display -p '#{pane_current_command}'
set -g default-command '~/.tmux/interactive-shell.sh'

# Scrollback buffer (generous for 32GB RAM server)
set -g history-limit 50000

# Enable mouse/touch support for Termius
set -g mouse on

# Clipboard integration
set -g set-clipboard on

# Focus events for better editor integration
set -g focus-events on

# Renumber windows when one is closed
set -g renumber-windows on

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Automatic window naming
# Shows directory basename when in shell, command name otherwise
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{m:*sh,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}'

# Multi-client window sizing
# "latest" = size to most recent active client (prevents overflow)
# "largest" = size to largest client (can cause content outside viewport)
set -g window-size latest
setw -g aggressive-resize on

# Disable visual bells (less disruptive on mobile)
set -g visual-activity off
set -g visual-bell off
set -g bell-action none

# Faster key repetition for responsive feel
set -g repeat-time 300

# Display messages longer for readability
set -g display-time 2000
set -g display-panes-time 2000

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Plugins (TPM)                                                                │
# └──────────────────────────────────────────────────────────────────────────────┘

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Sensible defaults
set -g @plugin 'tmux-plugins/tmux-sensible'

# Session persistence - survives reboots!
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Plugin Configuration                                                         │
# └──────────────────────────────────────────────────────────────────────────────┘

# tmux-resurrect: pane contents are NOT captured by default. With capture on,
# continuum writes every pane's visible text to disk every 15 minutes and keeps
# it, which on a machine that is not yours means its output persisted indefinitely
# (portable-core red team, 2026-09-29). Turn it back on in
# ~/.config/tmux/local.conf.
set -g @resurrect-capture-pane-contents 'off'

# tmux-resurrect: single-line, exact-parent save-command strategy.
# Upstream's default 'ps' strategy prints ONE LINE PER CHILD PROCESS, and
# save.sh splices that unquoted into the last tab-delimited field — so any pane
# whose shell has 2+ children (every Claude Code pane: its MCP server children)
# splits one record across many lines. A corrupt save makes restore produce no
# sessions, and restore.sh's handle_session_0 then kills session "0" — the one
# bare `tmux` creates — leaving zero sessions, so the server exits. That is the
# "tmux draws, then dies a beat after attach" crash (diagnosed 2026-08-25).
# Falls back to upstream 'ps' if the symlink is missing — see the header of
# agent-core/tmux/resurrect-strategies/firstline.sh before changing this.
set -g @resurrect-save-command-strategy 'firstline'

# tmux-continuum: auto-save every 15 minutes
set -g @continuum-save-interval '15'

# tmux-continuum: auto-restore on tmux start
set -g @continuum-restore 'on'

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Flexoki Theme                                                                │
# └──────────────────────────────────────────────────────────────────────────────┘

# Track current theme (for toggle)
set -g @theme "dark"

# Load Flexoki dark theme by default
source-file ~/.tmux/themes/flexoki-dark.tmuxtheme

# Refresh the status bar every 5s (default is 15s) so ~/.tmux/status-extra.sh
# drop-ins read as live rather than stale. Cheap: the dispatcher exits
# immediately when the drop-in dir is empty, which is the default.
set -g status-interval 5

# Pane titles on the top border. Blank for ordinary panes (just a thin
# divider); a labeled cyan tag for any pane that has been given an explicit
# title with `select-pane -T`. Result: you can see at a glance which pane is
# which named job, without adding visual noise to unnamed panes.
#
# Untitled panes are NOT blank by default — tmux seeds pane_title with the
# hostname — so match on that rather than on emptiness, or every pane sprouts a
# tag. #{==:...} compares pane_title to #{host_short}.
set -g pane-border-status top
set -g pane-border-format "#{?#{==:#{pane_title},#{host_short}},,#[fg=colour108] #{pane_title} #[default]}"

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Prefix Key                                                                   │
# └──────────────────────────────────────────────────────────────────────────────┘

# Change prefix from Ctrl-B to Ctrl-A (easier on iPad keyboards)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Unbind Conflicting Defaults                                                  │
# └──────────────────────────────────────────────────────────────────────────────┘

# Remove default prefix+M-# layout presets (conflict with window switching)
unbind M-1
unbind M-2
unbind M-3
unbind M-4
unbind M-5

# Remove default prefix+M-Left/Right resize (we use for window nav)
unbind -T prefix M-Left
unbind -T prefix M-Right

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Keybindings                                                                  │
# └──────────────────────────────────────────────────────────────────────────────┘

# Theme toggle: prefix + T
bind T run-shell '\
    if [ "$(tmux show -gv @theme)" = "dark" ]; then \
        tmux source-file ~/.tmux/themes/flexoki-light.tmuxtheme; \
        tmux set -g @theme "light"; \
        tmux display-message "Theme: Light"; \
    else \
        tmux source-file ~/.tmux/themes/flexoki-dark.tmuxtheme; \
        tmux set -g @theme "dark"; \
        tmux display-message "Theme: Dark"; \
    fi'

# Reload config: prefix + r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Pane Navigation (Termius/iPad optimized)                                     │
# └──────────────────────────────────────────────────────────────────────────────┘

# Option+Up/Down for pane navigation (no prefix needed)
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Option+[ and Option+] for left/right panes (avoids conflict with word nav)
bind -n M-[ select-pane -L
bind -n M-] select-pane -R

# Option+o to cycle through panes (easy single-key navigation)
bind -n M-o select-pane -t :.+

# Option+z to toggle zoom (maximize/restore current pane)
bind -n M-z resize-pane -Z

# prefix+q shows pane numbers - press number to select
# (display-panes-time already set to 2000ms above)

# Better splits (keep current directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Clear scrollback: prefix + Ctrl-k (memory management)
bind C-k clear-history \; display-message "History cleared"

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Layouts                                                                       │
# └──────────────────────────────────────────────────────────────────────────────┘

# Layouts other than dev may not be installed, so each binding runs its script
# only where it exists; elsewhere the key does nothing.
# Layout menu: prefix + L
bind L if-shell 'test -x ~/.tmux/layouts/menu.sh' "run-shell '~/.tmux/layouts/menu.sh'"

# Quick layout shortcuts (no menu)
bind M-d run-shell '~/.tmux/layouts/dev.sh'
bind M-b if-shell 'test -x ~/.tmux/layouts/browse-linked.sh' "run-shell '~/.tmux/layouts/browse-linked.sh'"
bind M-l if-shell 'test -x ~/.tmux/layouts/lf-browse.sh' "run-shell '~/.tmux/layouts/lf-browse.sh'"

# Launchpad: prefix + P
# Only where launchpad is installed; elsewhere prefix+P does nothing.
bind P if-shell 'test -x ~/.local/bin/launchpad' "new-window -n launchpad '~/.local/bin/launchpad'"

# Replace current pane with lf browser+preview
bind F if-shell 'test -x ~/.tmux/layouts/lf-replace-pane.sh' "run-shell '~/.tmux/layouts/lf-replace-pane.sh'"

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Window Navigation                                                             │
# └──────────────────────────────────────────────────────────────────────────────┘

# Option+1-9 to switch windows directly (no prefix)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Option+Left/Right for prev/next window
bind -n M-Left previous-window
bind -n M-Right next-window

# Option+n for new window (in current directory)
bind -n M-n new-window -c "#{pane_current_path}"

# ┌──────────────────────────────────────────────────────────────────────────────┐
# │ Keybinding Reference                                                         │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# Session Persistence (tmux-resurrect):
#   prefix + Ctrl-s    Save session
#   prefix + Ctrl-r    Restore session
#
# Layouts:
#   prefix + L         Open layout menu
#   prefix + M-d       Quick dev layout
#   prefix + M-b       Quick browse layout
#
# Window Navigation (no prefix):
#   Option + 1-9       Switch to window 1-9
#   Option + Left      Previous window
#   Option + Right     Next window
#   Option + n         New window
#
# Pane Navigation (no prefix):
#   Option + Up/Down   Move up/down between panes
#   Option + [ / ]     Move left/right between panes
#   Option + o         Cycle through panes
#   Option + z         Toggle zoom (maximize/restore)
#
# Custom:
#   prefix + T         Toggle light/dark theme
#   prefix + r         Reload this config
#   prefix + |         Split pane vertically
#   prefix + -         Split pane horizontally
#   prefix + Ctrl-k    Clear pane history
#

# Machine-local settings, last so they win; -q because most machines have none.
# The apply replaces ~/.tmux.conf outright, so this is where a machine's own
# tmux lines go, as the git and shell configs each read a local file last.
# Above the TPM line so any @plugin declared there is installed too.
source-file -q ~/.config/tmux/fleet.conf
source-file -q ~/.config/tmux/local.conf

# ══════════════════════════════════════════════════════════════════════════════
# Initialize TPM (keep this line at the very bottom of tmux.conf)
# ══════════════════════════════════════════════════════════════════════════════
run '~/.tmux/plugins/tpm/tpm'
